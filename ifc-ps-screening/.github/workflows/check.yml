name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rebuild everything that is generated from the rule set.
      - name: Build
        run: python make.py build

      # If the rebuild changed anything, someone edited a generated file by hand
      # or forgot to run `python make.py build` before committing.
      - name: Generated files are up to date
        run: git diff --exit-code

      - name: Test (rule-set lint, reference cases, HTML and engine agree)
        run: python make.py test

      - name: Package
        run: python make.py package

      - uses: actions/upload-artifact@v4
        with:
          name: ifc-ps-screening-dist
          path: dist/
